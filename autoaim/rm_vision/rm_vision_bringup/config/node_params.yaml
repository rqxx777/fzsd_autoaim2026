#       tracking_thres: 5
#       lost_time_thres: 1.0
/armor_tracker:
  ros__parameters:
    target_frame: odom
    max_armor_distance: 15.0

    ekf:
      sigma2_q_xyz_max: 3.0
      sigma2_q_xyz_min: 1.0
      sigma2_q_yaw_max: 6.0
      sigma2_q_yaw_min: 3.0
      sigma2_q_r: 40.0

      r_xyz_factor: 4e-4
      r_yaw: 8e-3

    tracker:
      max_match_distance: 0.5
      max_match_yaw_diff: 0.8

      tracking_thres: 5
      lost_time_thres: 1.0

/vision_attacker:
  ros__parameters:
    trajectory:
      lag_time: 0.1
      air_k: 0.04
      yaw_fix: 0.5
      pitch_fix: -0.5
    fire_ctrl:
      car_attack_threshold: 85.0
      outpost_attack_threshold: 5.0
      threshold_fix: 0.0

